# Une seule ouverture par semaine, 5 demandes ouvertes au plus par écosystème.
# Délai de 7 jours avant de proposer une nouvelle version (hors correctifs de sécurité).
# Types de commit : dépendances d'exécution fix(deps), développement et CI build(deps).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
