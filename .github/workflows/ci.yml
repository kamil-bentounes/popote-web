name: Contrôles
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  # Annuler un run dépassé seulement sur une demande de fusion : chaque envoi sur main est vérifié.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  front:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx tsc -p relais
      - run: npm test
      - run: npm run build
      # L'arbre de routes commité est celui que le plugin du routeur génère (le build l'a régénéré).
      - run: git diff --exit-code -- src/routeTree.gen.ts
      # L'essai sert `dist/` : il lui faut une page, un `sw.js` qui remplace l'ancien service worker
      # (voir scripts/verifie-sw-remplacant.mjs) et aucune trace de l'ancien front.
      - name: Garde du build
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          node scripts/verifie-sw-remplacant.mjs dist/sw.js
          if grep -rqiE 'supabase|sb_publishable' dist; then
            echo "dist contient une trace de l'ancien front (supabase ou sb_publishable)" >&2
            exit 1
          fi
          # axe-core (MPL-2.0) est un outil de test : il ne part jamais dans le build livré.
          if grep -rqiE 'axe-core' dist; then
            echo "dist contient axe-core (outil de test, licence MPL-2.0)" >&2
            exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # l'action liste les commits de la demande de fusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # pas de commentaire : le jeton reste en lecture seule
          # La version par défaut de l'action (8.24.3) ignore les [[allowlists]] de .gitleaks.toml ;
          # même version qu'en local.
          GITLEAKS_VERSION: "8.30.1"
  contrat:
    # Le client généré est celui du contrat, et le contrat est la copie exacte d'un commit de `main` de `popote-api`.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Le client et la liste des routes protégées sont ceux du contrat
        run: npm run contrat:verifie
      - name: La copie est celle du commit de AMONT, et AMONT est sur main
        run: node scripts/sync-contrat.mjs --verifie
        env:
          GITHUB_TOKEN: ${{ github.token }} # lecture seule ; ne part qu'à l'API de comparaison
  contrat-amont:
    # `popote-api` a-t-elle rompu son contrat depuis la copie du front ? Strict sur `main` et au quotidien ;
    # sur une demande de fusion, un avertissement : une rupture d'amont ne bloque pas une PR sans rapport.
    # Volontairement HORS de `resultat` : c'est l'API qui a bougé, le front reste cohérent avec SA copie
    # (que `contrat` garantit), et bloquer le déploiement du front n'y changerait rien.
    uses: ./.github/workflows/contrat-amont.yml
    permissions:
      contents: read
    with:
      strict: ${{ github.event_name != 'pull_request' }}
  resultat:
    # Le seul contrôle à exiger par la règle de branche. Tout job qui s'ajoute à `needs` y est compté.
    if: always()
    needs: [front, secrets, contrat]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Tous les contrôles ont réussi
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          for resultat in $RESULTATS; do
            if [ "$resultat" != success ]; then
              echo "::error::un contrôle n'a pas réussi ($RESULTATS)"
              exit 1
            fi
          done
  deploie-essai:
    # Déploiement de l'essai (essai.notre-popote.fr) : seulement après un envoi sur main dont tous les contrôles sont verts.
    needs: [resultat]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: essai
    # Un déploiement en cours n'est jamais annulé : le suivant attend son tour.
    concurrency:
      group: deploie-essai
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Déployer le Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Un échec ici fait échouer le job : l'essai est déployé mais ne répond pas comme attendu.
      # Quelques essais espacés (le temps que le Worker et le conteneur soient prêts), délai borné.
      - name: Fumée après déploiement
        run: bash scripts/fumee-essai.sh
        timeout-minutes: 5
        env:
          BASE_URL: https://essai.notre-popote.fr
          ESSAIS: "6"
          PAUSE: "10"
