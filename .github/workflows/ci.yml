name: Contrôles
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  # Annuler un run dépassé seulement sur une demande de fusion : chaque envoi sur main est vérifié.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  front:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx tsc -p relais
      - run: npm test
      - name: Les jetons sont ceux du système
        run: node scripts/verifie-jetons.mjs
      - run: npm run build
      # L'arbre de routes commité est celui que le plugin du routeur génère (le build l'a régénéré).
      - run: git diff --exit-code -- src/routeTree.gen.ts
      # L'essai sert `dist/` : il lui faut une page, un `sw.js` qui remplace l'ancien service worker, rien qui sorte de la
      # CSP (scripts/verifie-build.mjs) et aucune trace de l'ancien front. Le même contrôle rejoue avant le déploiement.
      - name: Garde du build
        run: bash scripts/garde-du-build.sh dist
      - run: npm audit --omit=dev --audit-level=high
  banc:
    # Le banc (banc.html) sous le vrai relais, CSP en `enforce`, dans Chromium (téléphone, PC) et WebKit (iPhone) : garde de CSP,
    # axe (contraste compris), cibles de 44 px, parcours au clavier, anneaux de focus, lien d'évitement. Plan de la fondation, F8.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Le build du banc passe la même garde que celui de la prod (seul `banc.html` y est admis, par `--banc`).
      - run: npm run build:banc
      - run: node scripts/verifie-build.mjs dist --banc
      - run: npx playwright test
        env:
          BANC_CONSTRUIT: "1" # le serveur des tests sert le `dist` contrôlé ci-dessus
      # La comparaison avec reference.html : une ligne par cas, les deux captures côte à côte (e2e/comparaison.spec.ts).
      - name: Index de la comparaison
        if: always()
        run: node e2e/comparaison/ecrit-index.ts captures/comparaison
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: comparaison
          path: captures/comparaison/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() # aussi quand le délai du job l'arrête (le cas probable d'un navigateur qui se fige)
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # l'action liste les commits de la demande de fusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # pas de commentaire : le jeton reste en lecture seule
          # La version par défaut de l'action (8.24.3) ignore les [[allowlists]] de .gitleaks.toml ;
          # même version qu'en local.
          GITLEAKS_VERSION: "8.30.1"
  deploie-essai:
    # Déploiement de l'essai (essai.notre-popote.fr) : seulement après un envoi sur main dont tous les contrôles sont verts.
    needs: [front, banc, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: essai
    # Un déploiement en cours n'est jamais annulé : le suivant attend son tour.
    concurrency:
      group: deploie-essai
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Ce job reconstruit `dist/` : le dist contrôlé par `front` n'est pas celui qu'on déploie.
      - name: Garde du build
        run: bash scripts/garde-du-build.sh dist
      - name: Déployer le Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Un échec ici fait échouer le job : l'essai est déployé mais ne répond pas comme attendu.
      # Quelques essais espacés (le temps que le Worker et le conteneur soient prêts), délai borné.
      - name: Fumée après déploiement
        run: bash scripts/fumee-essai.sh
        timeout-minutes: 5
        env:
          BASE_URL: https://essai.notre-popote.fr
          ESSAIS: "6"
          PAUSE: "10"
