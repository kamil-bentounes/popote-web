name: Contrôles
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  # Annuler un run dépassé seulement sur une demande de fusion : chaque envoi sur main est vérifié.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  front:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx tsc -p relais
      - run: npm test
      - run: npm run build
      # L'essai sert `dist/` : il lui faut une page, un `sw.js` qui remplace l'ancien service worker
      # (voir scripts/verifie-sw-remplacant.mjs) et aucune trace de l'ancien front.
      - name: Garde du build
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          node scripts/verifie-sw-remplacant.mjs dist/sw.js
          if grep -rqiE 'supabase|sb_publishable' dist; then
            echo "dist contient une trace de l'ancien front (supabase ou sb_publishable)" >&2
            exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # l'action liste les commits de la demande de fusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # pas de commentaire : le jeton reste en lecture seule
          # La version par défaut de l'action (8.24.3) ignore les [[allowlists]] de .gitleaks.toml ;
          # même version qu'en local.
          GITLEAKS_VERSION: "8.30.1"
  deploie-essai:
    # Déploiement de l'essai (essai.notre-popote.fr) : seulement après un envoi sur main dont tous les contrôles sont verts.
    needs: [front, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: essai
    # Un déploiement en cours n'est jamais annulé : le suivant attend son tour.
    concurrency:
      group: deploie-essai
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Déployer le Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Un échec ici fait échouer le job : l'essai est déployé mais ne répond pas comme attendu.
      # Quelques essais espacés (le temps que le Worker et le conteneur soient prêts), délai borné.
      - name: Fumée après déploiement
        run: bash scripts/fumee-essai.sh
        timeout-minutes: 5
        env:
          BASE_URL: https://essai.notre-popote.fr
          ESSAIS: "6"
          PAUSE: "10"
